<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat em Tempo Real</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="chat-container">
    <header>
      <h1>💬 Chat FastAPI</h1>
      <input type="text" id="room" placeholder="Sala (ex: geral)" value="geral" />
      <input type="text" id="username" placeholder="Seu nome" />
      <button id="connect">Entrar</button>
    </header>

    <main id="chat"></main>

    <footer>
      <input type="text" id="message" placeholder="Digite sua mensagem..." />
      <button id="send">Enviar</button>
    </footer>
  </div>

  <script>
    let socket = null;

    document.getElementById("connect").onclick = () => {
      if (socket && socket.readyState === WebSocket.OPEN) {
        alert("Você já está conectado!");
        return;
      }

      const room = document.getElementById("room").value.trim();
      const username = document.getElementById("username").value.trim();

      if (!room || !username) {
        alert("Informe a sala e o nome de usuário.");
        return;
      }

      socket = new WebSocket(`ws://${location.host}/ws/${room}`);

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "history") {
          data.items.forEach(showMessage);
        } else if (data.type === "message") {
          showMessage(data.item);
        }
      };

      socket.onclose = () => {
        alert("Desconectado do chat.");
        socket = null;
      };
    };

    document.getElementById("send").onclick = () => {
      const content = document.getElementById("message").value.trim();
      const username = document.getElementById("username").value.trim();

      if (!content || !username || !socket || socket.readyState !== WebSocket.OPEN) return;

      socket.send(JSON.stringify({ username, content }));
      document.getElementById("message").value = "";
    };

    function showMessage(msg) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.classList.add("message");

      const time = new Date(msg.created_at).toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit"
      });

      div.innerHTML = `
        <div class="meta">
          <strong>${msg.username}</strong> <span>${time}</span>
        </div>
        <div class="text">${msg.content}</div>
      `;

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
